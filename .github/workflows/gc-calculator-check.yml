name: GC calculator checks

on:
  pull_request:
    paths:
      - 'assets/js/gc-calculator.js'
      - 'assets/css/gc-calculator.css'
      - 'gc-calculator.html'
      - 'data/gc-std-master.json'
      - 'data/gc-favorite-analytes.json'
      - 'data/gc-analyte-aliases.json'
      - 'scripts/test-gc-calculator.mjs'
      - 'assets/js/gc-day-plan.js'
      - 'scripts/test-gc-day-plan.mjs'
      - 'assets/js/inventory.js'
      - 'scripts/test-inventory.mjs'
      - 'data/gc-method-rules.json'
      - '.github/workflows/gc-calculator-check.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/gc-calculator.js'
      - 'assets/css/gc-calculator.css'
      - 'gc-calculator.html'
      - 'data/gc-std-master.json'
      - 'data/gc-favorite-analytes.json'
      - 'data/gc-analyte-aliases.json'
      - 'scripts/test-gc-calculator.mjs'
      - 'assets/js/gc-day-plan.js'
      - 'scripts/test-gc-day-plan.mjs'
      - 'assets/js/inventory.js'
      - 'scripts/test-inventory.mjs'
      - 'data/gc-method-rules.json'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/gc-calculator.js
      - run: node scripts/test-gc-calculator.mjs
      - run: node scripts/test-gc-day-plan.mjs
      - run: node scripts/test-inventory.mjs
      - run: for file in assets/js/*.js; do node --check "$file"; done
