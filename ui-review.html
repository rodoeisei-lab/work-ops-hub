<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>業務ツール 表示確認</title><style>body{margin:0;font:16px sans-serif;background:#fff}header{padding:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;min-height:44px}iframe{display:block;border:0;width:390px;height:844px}label{display:flex;gap:6px;align-items:center}</style></head><body><header><label>ページ<select id="page"><option value="index.html">ホーム</option><option value="gc-calculator.html">GC計算</option><option value="gc-factors.html">係数ライブラリ</option><option value="inventory-memo.html">在庫メモ</option><option value="gc-day-plan.html">当日プラン</option><option value="gc-method-finder.html">条件提案</option><option value="gc-rt-library.html">RT</option><option value="gc-std-master.html">標準液</option><option value="qr-print.html">QR印刷</option><option value="update-guide.html">更新手順</option></select></label><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="1440">1440px</button><span id="size">390 × 844</span><label><input type="checkbox" id="previous">改善前</label></header><iframe id="screen" title="業務ツールの実画面" src="index.html"></iframe><script>const screen=document.getElementById('screen');function load(){screen.src=(document.getElementById('previous').checked?'./': 'preview-ui/')+document.getElementById('page').value+'?ui-review='+Date.now();}document.getElementById('page').addEventListener('change',load);document.getElementById('previous').addEventListener('change',load);document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{screen.style.width=b.dataset.width+'px';document.getElementById('size').textContent=b.dataset.width+' × 844';}));document.getElementById('previous').checked=true;</script></body></html>
