<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GC係数ライブラリ | 労働衛生・作業環境測定ハブ</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/gc-factors.css?v=20260907-mobile-2">
  <link rel="stylesheet" href="assets/css/gc-factor-cascade.css?v=20260908-cascade-1">
</head>
<body>
  <main class="wrap factor-page">
    <a class="factor-back" href="index.html">← ホームへ戻る</a>

    <section class="factor-head">
      <h1>GC係数ライブラリ</h1>
    </section>

    <section class="factor-card factor-calc-card" aria-labelledby="quickCalcTitle">
      <div class="factor-section-head">
        <h2 id="quickCalcTitle">代表係数で計算</h2>
        <a class="factor-day-link" href="gc-calculator.html?gc-version=20260902-easy-page-reset-1">当日STD →</a>
      </div>

      <div class="factor-calc-grid">
        <div class="factor-cascade">
          <div class="factor-cascade-row">
            <label class="factor-calc-field">カラム
              <select id="calc-column">
                <option value="">選択</option>
              </select>
            </label>
            <label class="factor-calc-field">温度
              <select id="calc-temp" disabled>
                <option value="">選択</option>
              </select>
            </label>
          </div>

          <label class="factor-calc-field">物質
            <select id="calc-analyte" disabled>
              <option value="">選択してください</option>
            </select>
          </label>

          <select id="calc-group" hidden aria-hidden="true" tabindex="-1">
            <option value="">選択してください</option>
          </select>
        </div>

        <div class="factor-calc-result factor-coefficient-box">
          <span>代表係数</span>
          <strong id="calc-factor">—</strong>
          <small id="calc-factor-meta"></small>
          <small id="calc-area-history"></small>
          <small id="calc-nd-threshold"></small>
        </div>

        <label class="factor-calc-field factor-area-field">検体エリア
          <input id="calc-sample-area" type="text" inputmode="decimal" placeholder="エリアを入力" autocomplete="off">
        </label>

        <div class="factor-calc-result factor-calc-ppm">
          <span>参考ppm</span>
          <strong><span id="calc-ppm">—</span> <small>ppm</small></strong>
        </div>
      </div>
      <p id="calc-message" class="factor-calc-message" aria-live="polite">カラムを選択してください。</p>
    </section>

    <section class="factor-card factor-list-card" aria-labelledby="summaryTitle">
      <div class="factor-section-head factor-list-head">
        <h2 id="summaryTitle">代表値一覧 <span id="summary-count" class="factor-count"></span></h2>
      </div>

      <details class="factor-filter-details">
        <summary>絞り込み</summary>
        <div class="factor-filter-body">
          <div class="factor-filter">
            <label>カラム
              <select id="filter-column"><option value="">すべて</option></select>
            </label>
            <label>温度
              <select id="filter-temp"><option value="">すべて</option></select>
            </label>
            <label>物質
              <input id="filter-analyte" type="search" placeholder="物質名">
            </label>
          </div>
          <button id="filter-reset" class="factor-reset" type="button">解除</button>
        </div>
      </details>

      <p id="load-error" class="factor-note factor-error" role="alert"></p>

      <div id="factor-summary-cards" class="factor-mobile-list" aria-label="代表値一覧"></div>

      <div class="factor-table-wrap factor-desktop-table">
        <table class="factor-table">
          <thead>
            <tr>
              <th>カラム</th><th>温度</th><th>物質</th><th>STD濃度</th><th>代表係数</th><th>換算面積</th><th>採用/全記録</th><th>外れ値</th><th>採用範囲</th>
            </tr>
          </thead>
          <tbody id="factor-summary-body"></tbody>
        </table>
      </div>
      <p id="summary-empty" class="factor-empty" hidden>該当する係数はありません。</p>
    </section>

    <details class="factor-card factor-details">
      <summary>
        <span>実測履歴</span>
        <small>日付・係数・判定</small>
      </summary>
      <div class="factor-details-body">
        <div id="factor-record-cards" class="factor-mobile-list" aria-label="実測記録"></div>
        <div class="factor-table-wrap factor-desktop-table">
          <table class="factor-table">
            <thead>
              <tr>
                <th>日付</th><th>カラム</th><th>温度</th><th>物質</th><th>STD濃度</th><th>係数</th><th>換算面積</th><th>判定</th><th>基準との差</th>
              </tr>
            </thead>
            <tbody id="factor-record-body"></tbody>
          </table>
        </div>
        <p id="record-empty" class="factor-empty" hidden>該当する記録はありません。</p>
      </div>
    </details>
  </main>
  <script src="assets/js/gc-factors.js?v=20260908-recheck-1" type="module"></script>
  <script src="assets/js/gc-factor-cascade.js?v=20260908-cascade-1" type="module"></script>
  <script src="assets/js/gc-factor-area-history.js?v=20260908-area-nd-2"></script>
</body>
</html>
