<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GC RTライブラリ | 作業用ミニハブ</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/gc-rt-library.css">
  <link rel="stylesheet" href="assets/css/work-ui.css?v=20261002-4">
</head>
<body>
  <main class="wrap rt-page">
    <header class="card section-block">
      <h1>GC RTライブラリ</h1>
      <p>機械・カラム・温度条件を合わせて保持時間（RT）を確認します。RTの単位は分（min）です。</p>
    </header>

    <section class="card section-block">
      <div class="filter-heading"><h2>絞り込み</h2><button type="button" class="btn-ghost" data-reset-filters>検索条件を解除</button></div>
      <div class="filter-grid">
        <label class="filter-search">物質名検索<input id="searchInput" type="search" placeholder="物質名で検索"></label>
        <label>機械<select id="machineFilter"><option value="">すべて</option></select></label>
        <label>カラム<select id="columnFilter"><option value="">すべて</option></select></label>
        <label>温度条件<select id="tempFilter"><option value="">すべて</option></select></label>
        <label>信頼度<select id="confidenceFilter"><option value="">すべて</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label>
        <label class="filter-favorite">よく使う物質<select id="favoriteFilter"><option value="">すべて</option><option value="common">通常よく使うのみ</option><option value="liquid_standard">液体スタンダードのみ</option><option value="any">よく使う（全体）</option></select></label>
      </div>
      <label class="toggle"><input id="lowOnly" type="checkbox">要確認または低のみ表示</label>
      <p id="summaryText" class="hint">読み込み中...</p>
    </section>

    <section class="card section-block">
      <h2>RT一覧（RTが短い順）</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">機械</th><th scope="col">カラム</th><th scope="col">温度条件</th><th scope="col">物質</th><th scope="col">RT(min)</th><th scope="col">信頼度</th><th scope="col">備考</th></tr></thead>
          <tbody id="tableBody"><tr><td colspan="7" class="empty-cell">読み込み中...</td></tr></tbody>
        </table>
      </div>
      <div id="mobileCardList" class="mobile-card-list"></div>
    </section>
  </main>

  <script src="assets/js/app.js?v=20261002-4"></script>
  <script src="assets/js/gc-favorites.js?v=20261002-4" defer></script>
  <script src="assets/js/gc-rt-library.js?v=20261002-4" defer></script>
</body>
</html>
