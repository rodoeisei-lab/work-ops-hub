<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GC標準液マスタ | 作業用ミニハブ</title>
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/gc-std-master.css">
  <link rel="stylesheet" href="assets/css/work-ui.css?v=20261002-10">
</head>
<body>
  <main class="wrap gc-std-page">
    <header class="card page-header">
      <h1>GC標準液マスタ</h1>
      <p>標準液の値と登録状態を確認できます。仮・要確認の値は、原資料を照合してから使用してください。</p>
    </header>

    <section class="card section-block" aria-labelledby="filterTitle">
      <div class="filter-heading"><h2 id="filterTitle">絞り込み</h2><button type="button" class="btn-ghost" data-reset-filters>検索条件を解除</button></div>
      <div class="filter-grid">
        <label>検索<input id="searchInput" type="search" placeholder="元表記 / 表示名（候補） / メモを検索"></label>
        <label>状態<select id="statusFilter"><option value="">すべて</option><option value="confirmed">確定</option><option value="provisional">仮</option><option value="needs_review">要確認</option></select></label>
        <label>信頼度<select id="confidenceFilter"><option value="">すべて</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label>
      </div>
      <label class="checkbox-label"><input id="needsReviewOnly" type="checkbox">要確認のみ表示</label>
      <p id="summaryText" class="hint">読み込み中...</p>
    </section>

    <section class="card section-block" aria-labelledby="tableTitle">
      <h2 id="tableTitle">標準液一覧</h2>
      <details class="data-help"><summary>登録状態・信頼度の意味</summary><p class="data-note">確定・仮・要確認は登録状態です。仮・要確認の値は原資料を確認してください。信頼度は読み取りの確かさで、当日標準液の品質保証ではありません。</p></details>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">元表記</th><th scope="col">表示名（候補）</th><th scope="col">STD（ppm）</th><th scope="col">信頼度</th><th scope="col">状態</th><th scope="col">備考</th></tr></thead>
          <tbody id="stdTableBody"><tr><td colspan="6" class="empty-cell">読み込み中...</td></tr></tbody>
        </table>
      </div>
      <div id="stdCardList" class="mobile-card-list"></div>
    </section>
  </main>

  <script src="assets/js/app.js?v=20261002-10"></script>
  <script src="assets/js/gc-favorites.js?v=20261002-8" defer></script>
  <script src="assets/js/gc-std-master.js?v=20261002-8" defer></script>
</body>
</html>
